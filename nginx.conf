server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # The app talks only to the Quran data API (and its mirror) and to audio hosts the user selects.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; media-src 'self' https: blob:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'" always;

  types { application/manifest+json webmanifest; }

  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
